<script>
// Theme before first paint, or the light shell flashes over a dark preference.
(function () {
  try {
    var t = localStorage.getItem('slabset-theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#2E2A24' : '#DED8CB');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<body>

<!-- Tabler outline icons, inlined: the app must work offline from the home screen. -->
<svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6l6 -6"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></symbol><symbol id="i-backspace" viewBox="0 0 24 24"><path d="M20 7v10a2 2 0 0 1 -2 2h-8.5l-5 -5a1.5 1.5 0 0 1 0 -2l5 -5h8.5a2 2 0 0 1 2 2z"/><path d="M12 10l4 4m0 -4l-4 4"/></symbol></svg>

<div class="shell">

  <header class="header">
    <div class="header-brand">
      <span class="brand-mark" aria-hidden="true">
        <img src="shared/logo.svg" width="36" height="36" alt="" />
      </span>
      <h1 class="title">
        <span class="title-brand">SlabSet</span><span class="title-sub">Concrete</span>
      </h1>
    </div>
    <button type="button" class="theme-toggle" id="btnTheme" aria-label="Switch to dark theme" aria-pressed="false">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      </svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="currentColor" stroke="currentColor" stroke-width="1.75"/>
        <path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <div id="scroll-area">

    <!-- Inputs card - Shape, Diagram and Job dimensions grouped into one card
         (2026-08-04, Andre's call; eyebrow renamed Job in v22.26). Diagram lives here
         as a live description of the Shape selection. Wastage lives in the scroll
         Order ledger (#volume-breakdown), not in #fields. Three cards in scroll:
         Job / Order / Supply (top Order pin removed in v22.30). -->
    <div class="inputs-card">

      <!-- "Job" eyebrow (v22.26 IA rename; was "Dimensions"). Card-level .tv-label,
           top-left, above Shape - same caption language as Order / Supply below. -->
      <div class="tv-label">Job</div>

      <!-- Shape name, a plain heading. Still the real shape switcher: the <select>
           overlays the whole heading, same invisible-overlay technique as before.
           Above the diagram (round 4 of the ordering - Diagram-then-Shape in round 1,
           Shape-then-Diagram in round 2, Diagram-then-Shape again in round 3, settled
           here). If this keeps flip-flopping, it's probably not a strong preference
           either way - worth asking Andre to just pick one for good next time it comes
           up rather than toggling again. -->
      <div class="shape-heading">
        <!-- aria-hidden - same decorative-echo pattern as .unit-picker-current:
             #shape-select already carries the accessible name/value. -->
        <span id="shape-current" aria-hidden="true">Slab</span>
        <svg class="ti shape-heading-chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        <select id="shape-select" aria-label="Shape"></select>
      </div>

      <!-- Diagram is inlined SVG, not an <img>, so the focused dimension can light up -
           carried over from v17. -->
      <div class="diagram-area">
        <div id="diagram" role="img" aria-label="Slab / Pad dimension diagram"></div>
      </div>

      <!-- Dimension fields, rendered from the active shape (Wastage moved out to the
           Outputs ledger, see app.js's wastageLedgerRow comment). -->
      <div id="fields"></div>

    </div>

    <!-- Order card (v22.26 rename; was "Volume"). Full ledger + wastage control.
         Between Job and Supply; sole order readout (top pin removed in v22.30). -->
    <div class="output-card" aria-label="Order">
      <div class="tv-section">
        <div class="tv-label">Order</div>
        <div id="volume-breakdown"></div>
      </div>
    </div>

    <!-- Supply card (v22.32 rename; was Buy / Buying options). Own .output-card after Order,
         spaced by #scroll-area's 12px gap. -->
    <div class="output-card" aria-label="Supply">
      <div class="output-order">
        <div class="tv-label">Supply</div>
        <div id="options" aria-live="polite" aria-label="Supply"></div>
      </div>
    </div>

    <p class="check-strip" id="check-strip" hidden></p>

    <div class="share-actions">
      <button type="button" class="spec-btn" id="btnCopy"><span id="copyLabel">Copy</span></button>
      <button type="button" class="spec-btn" id="btnShare"><span id="shareLabel">Share</span></button>
    </div>

    <footer class="foot">
      <p class="foot-links">
        <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · Version 23.3
      </p>
    </footer>

  </div>

  <div class="keypad-wrap is-hidden" id="keypad-wrap">
    <div id="keypad"></div>
  </div>

</div>

<script src="shared/app.js"></script>
</body>
</html>
