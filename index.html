<html lang="en-AU">

<meta charset="utf-8">

<title>SlabSet - Concrete calculator</title>
<meta name="description" content="Concrete calculator made for Australia. Professional-grade, metric only field tool for working out bags or ready-mix on site.">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="canonical" href="https://slabset.online/">
<script>
// Theme before first paint, or the light shell flashes over a dark preference.
(function () {
  try {
    var t = localStorage.getItem('slabset-theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#1c1c1e' : '#f2f2f7');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<meta property="og:site_name" content="SlabSet">
<meta property="og:title" content="SlabSet - Order the right amount">
<meta property="og:description" content="Concrete calculator made for Australia. Professional-grade, metric only field tool for working out bags or ready-mix on site.">
<meta property="og:url" content="https://slabset.online/">

<meta name="twitter:card" content="summary_large_image">

<body>

<!-- Tabler outline icons, inlined: the app must work offline from the home screen. -->
<svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6l6 -6"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></symbol></svg>

<div class="shell">

  <header class="header">
    <h1 class="title">
      <img class="title-logo" src="shared/logo.svg" alt="" width="20" height="20">
      <b>SlabSet</b> Concrete Pro
    </h1>
    <button type="button" class="theme-toggle" id="btnTheme" aria-label="Switch to dark theme" aria-pressed="false">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      </svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.75"/>
        <path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <!-- Shape and volume merged into one pinned row - the answer this app exists to
       produce, plus what it's answering for, in one glance. Never scrolls - you are
       typing with the keypad over the bottom third of the screen, and the number this
       app exists to produce must not be in the scrolling middle. -->
  <div class="vbar">
    <div class="shape-pulldown-inline">
      <svg class="ti vbar-chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      <span id="shape-current">Slab</span>
      <select id="shape-select" aria-label="Shape"></select>
    </div>
    <div class="vbar-value-group">
      <span class="vbar-eyebrow">Total Volume</span>
      <span class="vbar-value" id="volume-val">0.000 m³</span>
    </div>
  </div>

  <div id="scroll-area">

    <!-- Diagram is inlined SVG, not an <img>, so the focused dimension can light up -
         carried over from v17. Only the surrounding chrome (plain white face, no card)
         matches the new wireframe. Unpinned again 2026-08-01 - back to scrolling with
         the rest of the stack, see LIVE.md. -->
    <div class="diagram-area">
      <div id="diagram" role="img" aria-label="Slab / Pad dimension diagram"></div>
    </div>

    <!-- Dimension fields plus wastage, rendered from the active shape. Wastage is now a
         typed field like the others - the wireframe shows it as a plain value + "%" row,
         not a preset pull-down. -->
    <div id="fields"></div>

    <div class="order-block" aria-label="Order">
      <div class="section-label">What to order</div>
      <div id="options" aria-live="polite"></div>
    </div>

    <p class="check-strip" id="check-strip" hidden></p>
    <p class="toast" id="toast" hidden></p>

    <div class="share-actions">
      <button type="button" class="spec-btn" id="btnCopy"><span id="copyLabel">Copy</span></button>
      <button type="button" class="spec-btn spec-btn--primary" id="btnShare"><span id="shareLabel">Share</span></button>
    </div>

    <footer class="foot">
      <p class="foot-links">
        <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
      </p>
    </footer>

  </div>

  <div class="keypad-wrap" id="keypad-wrap">
    <div id="keypad"></div>
  </div>

</div>

<script src="shared/app.js"></script>
</body>
</html>
