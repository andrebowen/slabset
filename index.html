<script>
// Theme before first paint, or the light shell flashes over a dark preference.
(function () {
  try {
    var t = localStorage.getItem('slabset-theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#f2f2f7');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<meta property="og:title" content="SlabSet - Order the right amount">

</head>
<body>

<!-- Tabler outline icons, inlined: the app must work offline from the home screen. -->
<svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6l6 -6"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5l10 -10"/></symbol></svg>

<div class="shell">

  <header class="header">
    <h1 class="title">
      <b>SlabSet</b> Concrete Pro
    </h1>
    <button type="button" class="theme-toggle" id="btnTheme" aria-label="Switch to dark theme" aria-pressed="false">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      </svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="currentColor" stroke="currentColor" stroke-width="1.75"/>
        <path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <!-- Total Volume - pinned again, v19 round 2: Andre tried it unpinned (previous
       comment history below/in CONTEXT.md), then asked for it back at the top - this
       time as a card (--surface-1, --radius, margin on all sides so it floats free of
       the header above it) rather than the old v17/v18 chrome-bar treatment. Restores
       doctrine 1b's guarantee (answer never off-screen) with v19's card language
       instead of reverting to the bar look it originally had. -->
  <div class="volume-card">
    <span class="volume-eyebrow">Total Volume</span>
    <span class="volume-value" id="volume-val" role="status" aria-atomic="true">0.000 m³</span>
    <p class="volume-waste-note" id="volume-waste-note" style="visibility: hidden;"></p>
  </div>

  <div id="scroll-area">

    <!-- Inputs card - Shape, Diagram and Dimensions/Wastage grouped into one card
         (2026-08-04, Andre's call): resolves the earlier asymmetry where Volume and
         Order were cards but the actual input work sat bare on the page background.
         The Diagram lives here rather than staying its own bare element because it's a
         live description of the Shape selection, not decoration - it belongs with the
         inputs it's illustrating, same reasoning that put Wastage inside #fields as a
         field rather than off in Order. This is a deliberate partial walk-back toward
         v17's card-stack look, which v18 explicitly flattened away from - not a full
         reversal (still just 3 cards, not everything), but worth knowing that's the
         direction this moves in. -->
    <div class="inputs-card">

      <!-- Shape name, a plain heading. Still the real shape switcher: the <select>
           overlays the whole heading, same invisible-overlay technique as before.
           Above the diagram (round 4 of the ordering - Diagram-then-Shape in round 1,
           Shape-then-Diagram in round 2, Diagram-then-Shape again in round 3, settled
           here). If this keeps flip-flopping, it's probably not a strong preference
           either way - worth asking Andre to just pick one for good next time it comes
           up rather than toggling again. -->
      <div class="shape-heading">
        <span id="shape-current">Slab</span>
        <svg class="ti shape-heading-chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        <select id="shape-select" aria-label="Shape"></select>
      </div>

      <!-- Diagram is inlined SVG, not an <img>, so the focused dimension can light up -
           carried over from v17. -->
      <div class="diagram-area">
        <div id="diagram" role="img" aria-label="Slab / Pad dimension diagram"></div>
      </div>

      <!-- Dimension fields plus wastage, rendered from the active shape. Wastage is now
           a typed field like the others - the wireframe shows it as a plain value + "%"
           row, not a preset pull-down. -->
      <div id="fields"></div>

    </div>

    <div class="order-block" aria-label="Order">
      <div class="section-label">What to order</div>
      <div id="options" aria-live="polite"></div>
    </div>

    <p class="check-strip" id="check-strip" hidden></p>
    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

    <div class="share-actions">
      <button type="button" class="spec-btn" id="btnCopy"><span id="copyLabel">Copy</span></button>
      <button type="button" class="spec-btn spec-btn--primary" id="btnShare"><span id="shareLabel">Share</span></button>
    </div>

    <footer class="foot">
      <p class="foot-links">
        <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
      </p>
    </footer>

  </div>

  <div class="keypad-wrap is-hidden" id="keypad-wrap">
    <div id="keypad"></div>
  </div>

</div>

<script src="shared/app.js"></script>
</body>
</html>
