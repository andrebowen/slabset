<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iso diagram sandbox</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      grid-template-rows: 100%;
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
      background: #e4e4e7;
      color: #18181b;
      overflow: hidden;
    }
    aside {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: #f4f4f5;
      border-right: 1px solid #d4d4d8;
      overflow: auto;
    }
    h1 { margin: 0; font-size: 15px; font-weight: 700; }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
    }
    .note { margin: 0; font-size: 11px; color: #52525b; line-height: 1.4; }
    .shapes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .shapes button {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #d4d4d8;
      background: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }
    .shapes button.is-on { background: #18181b; color: #fff; border-color: #18181b; }
    .row {
      display: grid;
      grid-template-columns: 52px 1fr 32px;
      gap: 8px;
      align-items: center;
      font-weight: 600;
      font-size: 12px;
    }
    .row span { text-align: right; font-weight: 500; color: #52525b; font-variant-numeric: tabular-nums; }
    .row input[type="range"] { width: 100%; margin: 0; }
    .checks { display: flex; flex-direction: column; gap: 8px; }
    .checks label {
      display: flex; align-items: center; gap: 8px;
      font-weight: 500; font-size: 12px; cursor: pointer;
    }
    button.primary {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #18181b; background: #18181b; color: #fff;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    #status { margin: 0; font-size: 11px; color: #16a34a; }
    #status:empty { display: none; }
    .params[hidden] { display: none !important; }
    .params { display: flex; flex-direction: column; gap: 10px; }
    main {
      min-width: 0; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .stage {
      width: min(560px, 100%);
      aspect-ratio: 1;
      max-height: calc(100vh - 48px);
      background: #e4e4e7; /* grey so Solid fill on/off is visible */
      border-radius: 12px;
      border: 1px solid #d4d4d8;
      padding: 28px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
    }
    .stage svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <aside>
    <h1>Iso diagrams</h1>
    <div class="panel">
      <p class="note">RULES.md · 30° / 150° / 90° dims · labels 0° · no overlay</p>
      <div class="shapes" id="shapes">
        <button type="button" data-shape="slab" class="is-on">Slab</button>
        <button type="button" data-shape="footing">Footing</button>
        <button type="button" data-shape="pier">Pier</button>
        <button type="button" data-shape="column">Column</button>
        <button type="button" data-shape="stairs">Stairs</button>
        <button type="button" data-shape="gutter">Gutter</button>
      </div>

      <div class="params" id="p-slab">
        <label class="row">Size <input id="slab-S" type="range" min="70" max="160" value="100"><span>100</span></label>
        <label class="row">Thickness <input id="slab-H" type="range" min="20" max="80" value="36"><span>36</span></label>
      </div>
      <div class="params" id="p-footing" hidden>
        <label class="row">Len <input id="ft-L" type="range" min="120" max="220" value="188"><span>188</span></label>
        <label class="row">Wid <input id="ft-W" type="range" min="28" max="70" value="42"><span>42</span></label>
        <label class="row">Depth <input id="ft-H" type="range" min="24" max="60" value="36"><span>36</span></label>
      </div>
      <div class="params" id="p-pier" hidden>
        <label class="row">Size <input id="pier-S" type="range" min="50" max="100" value="74"><span>74</span></label>
        <label class="row">Depth <input id="pier-H" type="range" min="80" max="160" value="116"><span>116</span></label>
      </div>
      <div class="params" id="p-column" hidden>
        <label class="row">Dia <input id="col-D" type="range" min="40" max="90" value="68"><span>68</span></label>
        <label class="row">Ht <input id="col-H" type="range" min="80" max="180" value="136"><span>136</span></label>
      </div>
      <div class="params" id="p-stairs" hidden>
        <label class="row">Going <input id="st-G" type="range" min="20" max="45" value="35"><span>35</span></label>
        <label class="row">Rise <input id="st-R" type="range" min="16" max="36" value="26"><span>26</span></label>
        <label class="row">Width <input id="st-W" type="range" min="50" max="120" value="98"><span>98</span></label>
        <label class="row">Steps <input id="st-N" type="range" min="3" max="6" value="4"><span>4</span></label>
      </div>
      <div class="params" id="p-gutter" hidden>
        <label class="row">Len <input id="gu-L" type="range" min="100" max="180" value="152"><span>152</span></label>
        <label class="row">Kdep <input id="gu-KD" type="range" min="20" max="60" value="50"><span>50</span></label>
        <label class="row">Kht <input id="gu-KH" type="range" min="30" max="80" value="67"><span>67</span></label>
        <label class="row">Flag <input id="gu-FT" type="range" min="12" max="36" value="30"><span>30</span></label>
        <label class="row">Gwid <input id="gu-GW" type="range" min="40" max="110" value="94"><span>94</span></label>
      </div>

      <label class="row">Gap <input id="G" type="range" min="12" max="100" value="36"><span id="Gv">36</span></label>
      <label class="row">Label <input id="LG" type="range" min="8" max="48" value="16"><span id="LGv">16</span></label>
      <div class="checks">
        <label><input id="fill" type="checkbox" checked> Solid fill</label>
        <label><input id="dims" type="checkbox" checked> Dimensions</label>
      </div>
      <button class="primary" id="copy">Copy SVG</button>
      <p id="status"></p>
    </div>
  </aside>
  <main><div class="stage" id="stage"></div></main>
  <script>
  (function () {
    var C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6);
    var shape = 'slab';

    function iso(x, y, z) { return [(y - x) * C, -(x + y) * S - z]; }
    function f(n) { return n.toFixed(2); }
    function unit(v) {
      var len = Math.hypot(v[0], v[1]) || 1;
      return [v[0] / len, v[1] / len];
    }
    function axisAngle(a, b) {
      var deg = Math.atan2(-(b[1] - a[1]), b[0] - a[0]) * 180 / Math.PI;
      return ((deg % 180) + 180) % 180;
    }
    function assertAxis(a, b) {
      var deg = axisAngle(a, b);
      // Box: 30/90/150. Cylinder may also use 0° (horizontal project).
      if (![0, 30, 90, 150].some(function (t) { return Math.abs(deg - t) < 0.51; })) {
        console.error('BAD ANGLE', deg.toFixed(1));
      }
    }

    function face(pts, fill) {
      return '<path d="M ' + pts.map(function (p) { return f(p[0]) + ' ' + f(p[1]); }).join(' L ') +
        ' Z" fill="' + fill + '" stroke="#18181b" stroke-width="2.25" stroke-linejoin="round"/>';
    }
    function faceFill(pts, fill) {
      return '<path d="M ' + pts.map(function (p) { return f(p[0]) + ' ' + f(p[1]); }).join(' L ') +
        ' Z" fill="' + fill + '" stroke="none"/>';
    }
    function line(a, b, sw, op) {
      assertAxis(a, b);
      return '<line x1="' + f(a[0]) + '" y1="' + f(a[1]) + '" x2="' + f(b[0]) + '" y2="' + f(b[1]) +
        '" stroke="#18181b" stroke-width="' + sw + '" stroke-linecap="round"' +
        (op && op < 1 ? ' opacity="' + op + '"' : '') + '/>';
    }
    function tick(p, axisVec) {
      var u = unit(axisVec);
      return line([p[0] - u[0] * 3.5, p[1] - u[1] * 3.5], [p[0] + u[0] * 3.5, p[1] + u[1] * 3.5], 1.4);
    }
    var LABEL_SIZE = 14; // all diagram labels - dim names, Steps, step numbers
    var EXT_GAP = 8; // extension lines never touch the solid

    function extStart(feature, dimEnd) {
      var dx = dimEnd[0] - feature[0], dy = dimEnd[1] - feature[1];
      var len = Math.hypot(dx, dy) || 1;
      var t = Math.min(EXT_GAP / len, 0.45);
      return [feature[0] + dx * t, feature[1] + dy * t];
    }
    function labelLines(name) {
      return String(name || '').split('\n');
    }
    function labelSize(name) {
      var lines = labelLines(name);
      var w = Math.max(28, 0.58 * LABEL_SIZE * Math.max.apply(null, lines.map(function (ln) { return ln.length; })));
      var h = (LABEL_SIZE + 2) * lines.length;
      return [w, h];
    }
    function text(x, y, t, size) {
      size = size || LABEL_SIZE;
      var lines = labelLines(t);
      var base = ' text-anchor="middle" dominant-baseline="middle"' +
        ' font-family="system-ui,sans-serif" font-size="' + size + '" font-weight="600" fill="#18181b">';
      if (lines.length === 1) {
        return '<text x="' + f(x) + '" y="' + f(y) + '"' + base + lines[0] + '</text>';
      }
      var lineH = size * 1.2;
      var y0 = y - (lines.length - 1) * lineH / 2;
      var html = '<text x="' + f(x) + '" y="' + f(y0) + '"' + base + lines[0];
      for (var i = 1; i < lines.length; i++) {
        html += '<tspan x="' + f(x) + '" dy="' + f(lineH) + '">' + lines[i] + '</tspan>';
      }
      return html + '</text>';
    }
    function pathOpen(pts) {
      return '<path d="M ' + pts.map(function (p) { return f(p[0]) + ' ' + f(p[1]); }).join(' L ') +
        '" fill="none" stroke="#18181b" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    function labAt(a, b, outAxis, labelGap, name) {
      var u = unit(outAxis);
      var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      var label = name || 'Dim';
      var g = labelGap;
      var lab;
      while (g <= labelGap + 64) {
        if (Math.abs(a[0] - b[0]) < 0.01) lab = [mx + u[0] * g, my];
        else lab = [mx + u[0] * g, my + u[1] * g];
        if (!labHitsSeg(lab, label, a, b)) return lab;
        g += 2;
      }
      return lab;
    }
    function fit(parts) {
      var body = parts.join('\n');
      var xs = [], ys = [];
      var solidXs = [], solidYs = [];
      function add(x, y, solid) {
        xs.push(x); ys.push(y);
        if (solid) { solidXs.push(x); solidYs.push(y); }
      }
      body.replace(/(?:x1|x2|x)="([-\d.]+)"\s+(?:y1|y2|y)="([-\d.]+)"/g, function (_, a, b) {
        add(+a, +b, false); return '';
      });
      body.replace(/<path d="([^"]+)"([^>]*)>/g, function (_, d, attrs) {
        var solid = attrs.indexOf('fill="none"') < 0 && attrs.indexOf('fill=') >= 0;
        d.replace(/[ML]\s*([-\d.]+)\s+([-\d.]+)/g, function (_m, a, b) {
          add(+a, +b, solid); return '';
        });
        return '';
      });
      // Include label glyph boxes so text isn't clipped (supports multiline / tspan)
      body.replace(/<text ([^>]+)>([\s\S]*?)<\/text>/g, function (_, attrs, inner) {
        var xm = attrs.match(/\bx="([-\d.]+)"/);
        var ym = attrs.match(/\by="([-\d.]+)"/);
        if (!xm || !ym) return '';
        var name = inner.replace(/<[^>]+>/g, '\n').split('\n').filter(Boolean).join('\n');
        var lines = labelLines(name);
        var w = Math.max(36, 0.78 * LABEL_SIZE * Math.max.apply(null, lines.map(function (ln) { return ln.length; })));
        var h = (LABEL_SIZE + 6) * lines.length;
        var cy = +ym[1] + (lines.length > 1 ? (lines.length - 1) * (LABEL_SIZE * 1.2) / 2 : 0);
        xs.push(+xm[1] - w / 2, +xm[1] + w / 2);
        ys.push(cy - h / 2, cy + h / 2);
        return '';
      });
      var pad = 22;
      var cminx = Math.min.apply(null, xs) - pad, cmaxx = Math.max.apply(null, xs) + pad;
      var cminy = Math.min.apply(null, ys) - pad, cmaxy = Math.max.apply(null, ys) + pad;
      var cx, cy;
      if (solidXs.length) {
        cx = (Math.min.apply(null, solidXs) + Math.max.apply(null, solidXs)) / 2;
        cy = (Math.min.apply(null, solidYs) + Math.max.apply(null, solidYs)) / 2;
      } else {
        cx = (cminx + cmaxx) / 2;
        cy = (cminy + cmaxy) / 2;
      }
      var halfW = Math.max(cx - cminx, cmaxx - cx);
      var halfH = Math.max(cy - cminy, cmaxy - cy);
      var minx = cx - halfW, miny = cy - halfH;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
        f(minx) + ' ' + f(miny) + ' ' + f(2 * halfW) + ' ' + f(2 * halfH) +
        '" preserveAspectRatio="xMidYMid meet">\n' + body + '\n</svg>';
    }

    function cross2(o, a, b) {
      return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    }
    function convexHull(pts) {
      var s = pts.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
      if (s.length <= 2) return s;
      var lower = [], upper = [], i;
      for (i = 0; i < s.length; i++) {
        while (lower.length >= 2 && cross2(lower[lower.length - 2], lower[lower.length - 1], s[i]) <= 0) lower.pop();
        lower.push(s[i]);
      }
      for (i = s.length - 1; i >= 0; i--) {
        while (upper.length >= 2 && cross2(upper[upper.length - 2], upper[upper.length - 1], s[i]) <= 0) upper.pop();
        upper.push(s[i]);
      }
      lower.pop(); upper.pop();
      return lower.concat(upper);
    }
    function inPoly(p, poly) {
      for (var i = 0; i < poly.length; i++) {
        if (cross2(poly[i], poly[(i + 1) % poly.length], p) < -0.75) return false;
      }
      return true;
    }
    function segHits(a, b, poly) {
      for (var i = 1; i < 40; i++) {
        var t = i / 40;
        if (inPoly([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], poly)) return true;
      }
      return false;
    }
    function labHits(xy, name, poly) {
      var wh = labelSize(name), w = wh[0], h = wh[1];
      return [
        [xy[0] - w / 2, xy[1] - h / 2], [xy[0] + w / 2, xy[1] - h / 2],
        [xy[0] - w / 2, xy[1] + h / 2], [xy[0] + w / 2, xy[1] + h / 2]
      ].some(function (c) { return inPoly(c, poly); });
    }
    function labHitsSeg(xy, name, a, b) {
      var wh = labelSize(name), w = wh[0], h = wh[1];
      var xmin = xy[0] - w / 2, xmax = xy[0] + w / 2;
      var ymin = xy[1] - h / 2, ymax = xy[1] + h / 2;
      var pad = 2;
      for (var i = 0; i <= 40; i++) {
        var t = i / 40;
        var px = a[0] + (b[0] - a[0]) * t, py = a[1] + (b[1] - a[1]) * t;
        if (px >= xmin - pad && px <= xmax + pad && py >= ymin - pad && py <= ymax + pad) return true;
      }
      return false;
    }
    function labHitsSegs(xy, name, segs) {
      return segs.some(function (s) { return labHitsSeg(xy, name, s[0], s[1]); });
    }
    function place(maker, name, poly, dimGap, avoidSegs) {
      var minG = 48;
      var avoid = avoidSegs || [];
      for (var g = 12; g <= 400; g += 4) {
        var r = maker(g);
        var segs = avoid.concat([[r.a, r.b]]);
        if (!segHits(r.a, r.b, poly) && !labHits(r.lab, name, poly) && !labHitsSegs(r.lab, name, segs)) {
          minG = g; break;
        }
      }
      var use = Math.max(minG, dimGap);
      var out = maker(use);
      if (labHitsSegs(out.lab, name, avoid.concat([[out.a, out.b]]))) {
        for (g = use; g <= 400; g += 4) {
          out = maker(g);
          if (!labHitsSegs(out.lab, name, avoid.concat([[out.a, out.b]])) && !labHits(out.lab, name, poly)) {
            use = g; break;
          }
        }
        out = maker(use);
      }
      return out;
    }
    function pushDim(parts, d, tickAxis, name) {
      parts.push(line(extStart(d.e0, d.a), d.a, 0.9, 0.35), line(extStart(d.e1, d.b), d.b, 0.9, 0.35));
      parts.push(line(d.a, d.b, 1.2));
      parts.push(tick(d.a, tickAxis), tick(d.b, tickAxis));
      parts.push(text(d.lab[0], d.lab[1], name));
    }

    // ── BOX (slab / footing / pier) ─────────────────────────────────────────
    function buildBox(L, W, H, solid, showDims, dimGap, labelGap, depthName) {
      depthName = depthName || 'Depth';
      var N = iso(0, 0, 0), R = iso(0, W, 0), Lf = iso(L, 0, 0);
      var T = iso(0, 0, H), TR = iso(0, W, H), TL = iso(L, 0, H), TB = iso(L, W, H);
      var fill = solid ? '#ffffff' : 'none';
      var parts = [
        face([N, Lf, TL, T], fill),
        face([N, R, TR, T], fill),
        face([T, TL, TB, TR], fill)
      ];
      if (!showDims) return fit(parts);

      var poly = [TB, TR, R, N, Lf, TL];
      var v30 = iso(0, 1, 0), v150 = iso(1, 0, 0), v30out = iso(0, -1, 0);

      var D = place(function (g) {
        var a = iso(L, -g, H), b = iso(L, -g, 0);
        return { a: a, b: b, lab: labAt(a, b, v30out, labelGap, depthName), e0: TL, e1: Lf };
      }, depthName, poly, dimGap);
      var segs = [[D.a, D.b]];
      var Len = place(function (g) {
        var a = iso(0, W + g, H), b = iso(L, W + g, H);
        return { a: a, b: b, lab: labAt(a, b, v30, labelGap, 'Length'), e0: TR, e1: TB };
      }, 'Length', poly, dimGap, segs);
      segs = segs.concat([[Len.a, Len.b]]);
      var Wid = place(function (g) {
        var a = iso(L + g, 0, H), b = iso(L + g, W, H);
        return { a: a, b: b, lab: labAt(a, b, v150, labelGap, 'Width'), e0: TL, e1: TB };
      }, 'Width', poly, dimGap, segs);

      pushDim(parts, D, v30, depthName);
      pushDim(parts, Len, v30, 'Length');
      pushDim(parts, Wid, v150, 'Width');
      return fit(parts);
    }

    // ── COLUMN (cylinder) ───────────────────────────────────────────────────
    // Height projects off at 0° (horizontal). Diameter projects off at 90° (vertical).
    function buildColumn(dia, H, solid, showDims, dimGap, labelGap) {
      var r = dia / 2;
      var rx = r, ry = r * S;
      var top = iso(0, 0, H), bot = iso(0, 0, 0);
      var fill = solid ? '#ffffff' : 'none';

      function ell(cx, cy, t0, t1, n) {
        n = n || 42;
        var pts = [];
        for (var i = 0; i <= n; i++) {
          var t = t0 + (t1 - t0) * i / n;
          pts.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]);
        }
        return pts;
      }

      // Full silhouette only when solid (closes bottom; wireframe uses strokes alone)
      var parts = [];
      if (solid) {
        var sil = [[top[0] - rx, top[1]], [top[0] + rx, top[1]]]
          .concat(ell(bot[0], bot[1], 0, Math.PI));
        parts.push(
          '<path d="M ' + sil.map(function (p) { return f(p[0]) + ' ' + f(p[1]); }).join(' L ') +
            ' Z" fill="' + fill + '" stroke="none"/>'
        );
      }
      parts.push(
        face(ell(top[0], top[1], 0, Math.PI * 2), fill),
        pathOpen(ell(bot[0], bot[1], 0, Math.PI)),
        '<line x1="' + f(top[0] - rx) + '" y1="' + f(top[1]) + '" x2="' + f(bot[0] - rx) + '" y2="' + f(bot[1]) +
          '" stroke="#18181b" stroke-width="2.25" stroke-linecap="round"/>',
        '<line x1="' + f(top[0] + rx) + '" y1="' + f(top[1]) + '" x2="' + f(bot[0] + rx) + '" y2="' + f(bot[1]) +
          '" stroke="#18181b" stroke-width="2.25" stroke-linecap="round"/>'
      );
      if (!showDims) return fit(parts);

      var gH = Math.max(dimGap, ry + 12);
      var gD = Math.max(dimGap, 20);

      var eL = [top[0] - rx, top[1]], eR = [top[0] + rx, top[1]];
      var da = [eL[0], top[1] - gH], db = [eR[0], top[1] - gH];
      var dLab = labAt(da, db, [0, -1], labelGap, 'Diameter');
      pushDim(parts, { a: da, b: db, lab: dLab, e0: eL, e1: eR }, [0, -1], 'Diameter');

      var hx = top[0] - rx - gD;
      var ha = [hx, top[1]], hb = [hx, bot[1]];
      var hLab = labAt(ha, hb, [-1, 0], labelGap, 'Height');
      while (labHitsSegs(hLab, 'Height', [[da, db], [ha, hb]]) && gD < 120) {
        gD += 4;
        hx = top[0] - rx - gD;
        ha = [hx, top[1]]; hb = [hx, bot[1]];
        hLab = labAt(ha, hb, [-1, 0], labelGap, 'Height');
      }
      pushDim(parts, {
        a: ha, b: hb, lab: hLab,
        e0: [top[0] - rx, top[1]], e1: [bot[0] - rx, bot[1]]
      }, [1, 0], 'Height');

      return fit(parts);
    }

    // ── STAIRS ──────────────────────────────────────────────────────────────
    function buildStairs(going, rise, width, n, solid, showDims, dimGap, labelGap) {
      var total = n * going;
      var zTop = n * rise;
      var fill = solid ? '#ffffff' : 'none';
      var parts = [];
      var i, x0, x1, z0, z1;

      var near = [iso(0, 0, 0)];
      var far = [iso(0, width, 0)];
      for (i = 0; i < n; i++) {
        x0 = i * going; x1 = (i + 1) * going; z1 = (i + 1) * rise;
        near.push(iso(x0, 0, z1), iso(x1, 0, z1));
        far.push(iso(x0, width, z1), iso(x1, width, z1));
      }
      near.push(iso(total, 0, 0));
      far.push(iso(total, width, 0));

      // Side face fill, then left + bottom strokes UNDER steps (steps cover any bleed)
      if (solid) {
        parts.push(faceFill(near, fill));
        parts.push(faceFill([
          iso(total, 0, zTop), iso(total, width, zTop),
          iso(total, width, zTop - rise), iso(total, 0, zTop - rise)
        ], fill));
      }
      parts.push(line(iso(total, 0, 0), iso(total, 0, zTop), 2.25)); // left edge
      parts.push(line(iso(0, 0, 0), iso(total, 0, 0), 2.25)); // bottom edge

      for (i = n - 1; i >= 0; i--) {
        x0 = i * going; x1 = (i + 1) * going;
        z0 = i * rise; z1 = (i + 1) * rise;
        parts.push(face([
          iso(x0, width, z0), iso(x0, width, z1),
          iso(x0, 0, z1), iso(x0, 0, z0)
        ], fill));
        parts.push(face([
          iso(x0, 0, z1), iso(x1, 0, z1),
          iso(x1, width, z1), iso(x0, width, z1)
        ], fill));
      }

      // Stepped near silhouette + re-stroke left edge on top
      for (i = 0; i < n; i++) {
        x0 = i * going; x1 = (i + 1) * going;
        z0 = i * rise; z1 = (i + 1) * rise;
        parts.push(line(iso(x0, 0, z0), iso(x0, 0, z1), 2.25));
        parts.push(line(iso(x0, 0, z1), iso(x1, 0, z1), 2.25));
      }
      parts.push(line(iso(total, 0, zTop), iso(total, 0, 0), 2.25));
      parts.push(line(iso(0, 0, 0), iso(going, 0, 0), 2.25));

      for (i = 0; i < n; i++) {
        x0 = i * going;
        var mid = iso(x0 + going * 0.35, width + dimGap * 0.55, (i + 0.5) * rise);
        parts.push(text(mid[0], mid[1], String(i + 1)));
      }

      if (showDims) {
        var v30 = iso(0, 1, 0), v150 = iso(1, 0, 0);
        var poly = convexHull(near.concat(far).concat([
          iso(total, 0, zTop), iso(total, width, zTop)
        ]));

        // Going off step 2 tread; Rise off step 3/4 riser
        var iGo = Math.min(1, n - 1);
        var xg0 = iGo * going, xg1 = (iGo + 1) * going, zg = (iGo + 1) * rise;
        var iRi = n - 1;
        var xr = iRi * going, zr1 = (iRi + 1) * rise, zr0 = iRi * rise;

        var Go = place(function (g) {
          var a = iso(xg0, width + g, zg), b = iso(xg1, width + g, zg);
          return { a: a, b: b, lab: labAt(a, b, v30, labelGap, 'Going'), e0: iso(xg0, width, zg), e1: iso(xg1, width, zg) };
        }, 'Going', poly, dimGap + 12);
        var Ri = place(function (g) {
          var a = iso(xr, width + g, zr1), b = iso(xr, width + g, zr0);
          return { a: a, b: b, lab: labAt(a, b, v30, labelGap, 'Rise'), e0: iso(xr, width, zr1), e1: iso(xr, width, zr0) };
        }, 'Rise', poly, dimGap + 12, [[Go.a, Go.b]]);
        var Wid = place(function (g) {
          var a = iso(total + g, 0, zTop), b = iso(total + g, width, zTop);
          return { a: a, b: b, lab: labAt(a, b, v150, labelGap, 'Width'), e0: iso(total, 0, zTop), e1: iso(total, width, zTop) };
        }, 'Width', poly, dimGap, [[Go.a, Go.b], [Ri.a, Ri.b]]);

        pushDim(parts, Wid, v150, 'Width');
        pushDim(parts, Go, v30, 'Going');
        pushDim(parts, Ri, v30, 'Rise');
        // Steps label near step 1, clear of the "1" numeral
        var lab = iso(going * 0.15, width + dimGap * 1.55, rise * 0.35);
        parts.push(text(lab[0], lab[1], 'Steps'));
      }
      return fit(parts);
    }

    // ── GUTTER - L-profile extruded on +x ───────────────────────────────────
    // Visible faces + both end L plugs (opaque). End outlines omit bottom under-runs
    // so strokes never ghost through long faces.
    function buildGutter(L, KD, KH, FT, GW, solid, showDims, dimGap, labelGap) {
      var HT = KH + FT, XF = KD + GW;
      var YO = 0, YJ = GW, YF = XF;
      var fill = solid ? '#ffffff' : 'none';
      var P = iso;
      var parts = [];

      function endL(x) {
        return [
          P(x, YO, 0), P(x, YO, FT), P(x, YJ, FT), P(x, YJ, HT),
          P(x, YF, HT), P(x, YF, 0), P(x, YJ, 0)
        ];
      }
      function strokeEndL(x) {
        // Full L silhouette including ground bottom (YO→YJ→YF at z=0)
        parts.push(line(P(x, YO, 0), P(x, YO, FT), 2.25));
        parts.push(line(P(x, YO, FT), P(x, YJ, FT), 2.25));
        parts.push(line(P(x, YJ, FT), P(x, YJ, HT), 2.25));
        parts.push(line(P(x, YJ, HT), P(x, YF, HT), 2.25));
        parts.push(line(P(x, YF, HT), P(x, YF, 0), 2.25));
        parts.push(line(P(x, YF, 0), P(x, YJ, 0), 2.25));
        parts.push(line(P(x, YJ, 0), P(x, YO, 0), 2.25));
      }

      // End plugs + outlines first; long faces last so they occlude under-run ghosts
      if (solid) parts.push(faceFill(endL(L), fill));
      else parts.push(face(endL(L), 'none'));
      strokeEndL(L);

      if (solid) parts.push(faceFill(endL(0), fill));
      else parts.push(face(endL(0), 'none'));
      strokeEndL(0);

      parts.push(face([P(0, YO, 0), P(L, YO, 0), P(L, YO, FT), P(0, YO, FT)], fill)); // outer
      parts.push(face([P(0, YO, FT), P(L, YO, FT), P(L, YJ, FT), P(0, YJ, FT)], fill)); // flag top
      parts.push(face([P(0, YJ, HT), P(L, YJ, HT), P(L, YF, HT), P(0, YF, HT)], fill)); // kerb top
      parts.push(face([P(0, YJ, FT), P(L, YJ, FT), P(L, YJ, HT), P(0, YJ, HT)], fill)); // upright
      // Re-stroke outer bottom so the front face baseline stays crisp on top
      parts.push(line(P(0, YO, 0), P(L, YO, 0), 2.25));

      if (!showDims) return fit(parts);

      var v30 = iso(0, 1, 0), v150 = iso(1, 0, 0), v30out = iso(0, -1, 0);
      var poly = convexHull([
        P(0, YO, 0), P(L, YO, 0), P(0, YO, FT), P(L, YO, FT),
        P(0, YJ, FT), P(L, YJ, FT), P(0, YJ, HT), P(L, YJ, HT),
        P(0, YF, HT), P(L, YF, HT), P(0, YF, 0), P(L, YF, 0)
      ]);

      // Length from lowest edge (z=0 ground), not flag top
      var Len = place(function (g) {
        var a = iso(0, YO - g, 0), b = iso(L, YO - g, 0);
        return { a: a, b: b, lab: labAt(a, b, v30out, labelGap, 'Length'), e0: P(0, YO, 0), e1: P(L, YO, 0) };
      }, 'Length', poly, dimGap);
      var segs = [[Len.a, Len.b]];

      var FT_LAB = 'Flag\nthickness';
      var FT_ = place(function (g) {
        var a = iso(L, YO - g, FT), b = iso(L, YO - g, 0);
        return { a: a, b: b, lab: labAt(a, b, v30out, labelGap, FT_LAB), e0: P(L, YO, FT), e1: P(L, YO, 0) };
      }, FT_LAB, poly, dimGap, segs);
      segs = segs.concat([[FT_.a, FT_.b]]);

      var KD_ = place(function (g) {
        var a = iso(L, YF, HT + g), b = iso(L, YJ, HT + g);
        return { a: a, b: b, lab: labAt(a, b, [0, -1], labelGap, 'Kerb depth'), e0: P(L, YF, HT), e1: P(L, YJ, HT) };
      }, 'Kerb depth', poly, dimGap + 14, segs);
      segs = segs.concat([[KD_.a, KD_.b]]);

      // Gutter width off back end (x=L), not front (x=0)
      var GW_LAB = 'Gutter\nwidth';
      var GW_ = place(function (g) {
        var a = iso(L + g, YJ, FT), b = iso(L + g, YO, FT);
        return { a: a, b: b, lab: labAt(a, b, v150, labelGap, GW_LAB), e0: P(L, YJ, FT), e1: P(L, YO, FT) };
      }, GW_LAB, poly, dimGap + 12, segs);
      segs = segs.concat([[GW_.a, GW_.b]]);

      // Kerb height off front face (upright at YJ), not rear at YF
      var KH_ = place(function (g) {
        var a = iso(L + g, YJ, HT), b = iso(L + g, YJ, FT);
        return { a: a, b: b, lab: labAt(a, b, v150, labelGap, 'Kerb height'), e0: P(L, YJ, HT), e1: P(L, YJ, FT) };
      }, 'Kerb height', poly, dimGap + 14, segs);

      pushDim(parts, Len, v30, 'Length');
      pushDim(parts, FT_, v30, FT_LAB);
      pushDim(parts, GW_, v150, GW_LAB);
      pushDim(parts, KH_, v150, 'Kerb height');
      pushDim(parts, KD_, [0, -1], 'Kerb depth');

      return fit(parts);
    }

    // ── UI ──────────────────────────────────────────────────────────────────
    function $(id) { return document.getElementById(id); }
    function syncRow(input) {
      var span = input.parentElement.querySelector('span');
      if (span) span.textContent = input.value;
    }
    document.querySelectorAll('.row input[type=range]').forEach(function (inp) {
      inp.addEventListener('input', function () { syncRow(inp); render(); });
    });

    document.getElementById('shapes').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-shape]');
      if (!btn) return;
      shape = btn.dataset.shape;
      document.querySelectorAll('#shapes button').forEach(function (b) {
        b.classList.toggle('is-on', b === btn);
      });
      ['slab', 'footing', 'pier', 'column', 'stairs', 'gutter'].forEach(function (s) {
        $('p-' + s).hidden = s !== shape;
      });
      render();
    });

    ['fill', 'dims'].forEach(function (id) {
      var el = $(id);
      el.addEventListener('change', render);
      el.addEventListener('input', render);
    });

    function render() {
      var g = +$('G').value, lg = +$('LG').value;
      $('Gv').textContent = g; $('LGv').textContent = lg;
      var solid = $('fill').checked, showDims = $('dims').checked;
      var svg;
      if (shape === 'slab') {
        var s = +$('slab-S').value, h = +$('slab-H').value;
        svg = buildBox(s * 1.6, s, h, solid, showDims, g, lg, 'Thickness');
      } else if (shape === 'footing') {
        svg = buildBox(+$('ft-L').value, +$('ft-W').value, +$('ft-H').value, solid, showDims, g, lg);
      } else if (shape === 'pier') {
        var ps = +$('pier-S').value;
        svg = buildBox(ps, ps, +$('pier-H').value, solid, showDims, g, lg);
      } else if (shape === 'column') {
        svg = buildColumn(+$('col-D').value, +$('col-H').value, solid, showDims, g, lg);
      } else if (shape === 'stairs') {
        svg = buildStairs(+$('st-G').value, +$('st-R').value, +$('st-W').value, +$('st-N').value, solid, showDims, g, lg);
      } else {
        svg = buildGutter(+$('gu-L').value, +$('gu-KD').value, +$('gu-KH').value, +$('gu-FT').value, +$('gu-GW').value, solid, showDims, g, lg);
      }
      window.__svg = svg;
      $('stage').innerHTML = svg;
    }

    $('copy').onclick = function () {
      navigator.clipboard.writeText(window.__svg).then(function () {
        $('status').textContent = 'Copied ' + shape + '.';
      });
    };

    render();
  })();
  </script>
</body>
</html>
