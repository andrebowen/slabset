<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order cards - HIG</title>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --soft: #71717a;
    --blue: #93c5fd;
    --font: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px;
    max-width: 390px;
  }
  .rec__choices { display: flex; flex-direction: column; gap: 16px; }
  .rec-group {
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
  }
  .rec-group__lab {
    margin: 0;
    padding: 14px 16px 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rec-group__lab--rec { color: var(--blue); }
  .rec-choice { padding: 8px 16px 14px; }
  .qty-line { font-size: 16px; font-weight: 700; margin: 0; }
  .qty-line--alt { font-size: 14px; font-weight: 600; color: var(--muted); margin: 4px 0 0; }
  .rec-choice__note { margin: 8px 0 0; font-size: 13px; color: var(--soft); line-height: 1.35; }
</style>
</head>
<body>
  <div class="rec__choices">
    <div class="rec-group">
      <h3 class="rec-group__lab rec-group__lab--rec">Recommended</h3>
      <div class="rec-choice">
        <p class="qty-line">1.0 m³ Ready-mix</p>
        <p class="rec-choice__note">Past 0.5 m³, ready-mix is usually cheaper than bags.</p>
      </div>
    </div>
    <div class="rec-group">
      <h3 class="rec-group__lab">Other options</h3>
      <div class="rec-choice">
        <p class="qty-line">100 × 20 kg bags</p>
        <p class="qty-line qty-line--alt">67 × 30 kg bags</p>
        <p class="rec-choice__note">Good option if truck access is difficult.</p>
      </div>
    </div>
  </div>
</body>
</html>
